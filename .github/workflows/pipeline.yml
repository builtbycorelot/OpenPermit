name: pipeline

# The CORELOT standard pipeline — one repo, one file, one workflow.
# https://github.com/corelotorg/.github#readme
#
# `runner: rig` is the in-cluster ARC org pool on Charlie. GitHub-hosted minutes
# bill against the monthly cap; the pool does not, and it carries the node-local
# tool cache, so the gates below cost seconds rather than minutes.

on:
  pull_request:
    branches: [test, prod]
  push:
    branches: [test, prod]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded PR run rather than let it hold one of the pool's 12 slots.
# Push runs are never cancelled: a lane build is the record of what shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: corelotorg/.github/.github/workflows/pipeline.yml@v1
    with:
      # `none`, deliberately. The Python here is two separate projects
      # (conformance/, reference-node/) with a requirement file each and no root
      # manifest, so py-ci's single working-directory cannot cover both — it would
      # fail preflight at the root or test only half the tree. The ORI harness in
      # ori-conformance.yml already installs both and runs validate.py, py_compile
      # and the precedence-graph tests; this caller adds the gates that were
      # missing entirely.
      lang: none
      runner: rig
